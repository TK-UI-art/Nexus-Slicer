name: Mac launch test

on:
  push:
    branches:
      - mac-crash-test

permissions:
  actions: read
  contents: read

jobs:
  launch:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        config: [fresh, configured]
        dark: [light]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mactest
      - uses: actions/download-artifact@v4
        with:
          name: OrcaSlicer_Mac_universal_V2.6.0-dev
          run-id: 45887250563
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art
      - name: Prepare
        shell: bash
        run: |
          if [ "${{ matrix.config }}" = configured ]; then
            d="$HOME/Library/Application Support/OrcaSlicer"; mkdir -p "$d"
            tar xzf .github/mactest/config.tgz -C "$d"; ls "$d"
          fi
          if [ "${{ matrix.dark }}" = dark ]; then
            osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || defaults write -g AppleInterfaceStyle Dark
          fi
          defaults read -g AppleInterfaceStyle || echo light
      - name: Launch
        shell: bash
        run: |
          set -x
          find art -maxdepth 3 | head -50
          mkdir -p apps out
          dmg=$(find art -name '*.dmg' | head -1)
          if [ -n "$dmg" ]; then
            hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/orca
            cp -R /Volumes/orca/*.app apps/
          else
            zip=$(find art -name '*.zip' | head -1)
            [ -n "$zip" ] && ditto -x -k "$zip" apps
            find art -maxdepth 3 -name '*.app' -exec cp -R {} apps/ \;
          fi
          app=$(find apps -maxdepth 2 -name '*.app' | head -1)
          echo "app=$app"
          xattr -cr "$app" || true
          exe="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
          "$exe" > out/stdout.txt 2>&1 &
          pid=$!
          for i in $(seq 1 24); do
            sleep 5
            if ! kill -0 $pid 2>/dev/null; then echo "EXITED after $((i*5))s"; break; fi
            [ $i = 6 ] && screencapture -x out/screen_30s.png || true
          done
          if kill -0 $pid 2>/dev/null; then echo "STILL RUNNING after 120s"; screencapture -x out/screen_120s.png || true; sample $pid 5 -file out/sample.txt || true; head -150 out/sample.txt || true; kill $pid; fi
          wait $pid; echo "exit code $?"
          tail -100 out/stdout.txt
          sleep 10
          cp ~/Library/Logs/DiagnosticReports/*Orca* out/ 2>/dev/null || true
          ls -la ~/Library/Logs/DiagnosticReports/ | tail
          cp -R "$HOME/Library/Application Support/OrcaSlicer/log" out/orca_log 2>/dev/null || true
          for f in out/orca_log/*; do echo "== $f"; tail -40 "$f"; done
          for f in out/*.ips; do [ -f "$f" ] && head -c 20000 "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-${{ matrix.os }}-${{ matrix.config }}-${{ matrix.dark }}
          path: out
